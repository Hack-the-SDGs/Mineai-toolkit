[project]
name = "mineai-toolkit"
version = "0.1.0"
description = "An MCP server exposing the minethon Mineflayer bot as model-callable tools."
authors = [{ name = "reep_c", email = "reep_c@outlook.com" }]
requires-python = ">=3.14,<4.0.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mcp (>=1.28.0,<2.0.0)",
    "fastmcp (>=3.4.2,<4.0.0)",
    "anyio (>=4.0.0,<5.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "starlette (>=0.40,<2.0)",
    "uvicorn (>=0.30,<1.0)",
    "minethon>=0.4.9,<0.5.0",
]

[project.scripts]
mineai-control = "main:main"
mineai-mcp = "main:stdio_removed"

[tool.hatch.build.targets.sdist]
include = [
    "tools",
    "bot_manager.py",
    "bot_session.py",
    "control_api.py",
    "server.py",
    "main.py",
]

[tool.hatch.build.targets.wheel]
include = [
    "tools",
    "bot_manager.py",
    "bot_session.py",
    "control_api.py",
    "server.py",
    "main.py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
